 ```

 Important GitHub Pages note: GitHub’s hosted build for github.io sites supports the kramdown math engine, but it does not allow arbitrary Jekyll plugins.
 If the snippet above doesn’t render equations after rebuilding, the safest approach is to add MathJax directly in your HTML layout’s <head> instead of
 relying on _config.yml:

 ```html
   <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
