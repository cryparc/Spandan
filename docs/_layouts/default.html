<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPANDAN (स्पंदन) - Cyber-Jungle DSP</title>
    <!-- Importing Sci-Fi/Tech fonts to match the Cyber vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
    <div class="plugin-window">
        
        <!-- Custom LookAndFeel Header -->
        <header class="plugin-header">
            <h1 class="main-title">SPANDAN (स्पंदन)</h1>
            <h2 class="sub-title">Advanced Real-Time Polyphonic Synthesizer</h2>
            <div class="author-tag">By Prashant Singh & Parth Srivastava</div>
        </header>

        <!-- Markdown Content Injected Here -->
        <main class="content-area">
            {{ content }} 
        </main>

    </div>
    <!-- Floating Action Button System -->
        <div class="fab-container">
            <div class="fab-menu" id="fabMenu">
                <div class="fab-header">Stay Updated</div>
                <!-- GitHub Link (Goes to the commits page to see latest updates) -->
                <a href="https://github.com/cryparc/Spandan/commits/main" target="_blank" class="fab-item">
                    💻 GitHub Repo
                </a>
                <a href="https://www.linkedin.com/in/cryparc/" target="_blank" class="fab-item">
                    🔗 Prashant's LinkedIn
                </a>
                <a href="https://www.linkedin.com/in/parth-srivastava100/" target="_blank" class="fab-item">
                    🔗 Parth's LinkedIn
                </a>
            </div>
            <button class="fab-button" onclick="toggleFab()">See Latest Updates</button>
        </div>

        <!-- Tiny script to toggle the popup menu -->
        <script>
            function toggleFab() {
                const menu = document.getElementById('fabMenu');
                menu.classList.toggle('active');
            }
        </script>
</body>
</html>
